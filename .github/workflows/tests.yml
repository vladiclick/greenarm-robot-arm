name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: GreenArm-03
        working-directory: GreenArm-03
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_*.py'
      - name: GreenArm-02
        working-directory: GreenArm-02
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_*.py'
